<!--Contact Section-->
<section id="contact" class="contact-section py-5" data-section="contact-section">
    <div class="container py-5">
        <header class="mb-4 text-white">
            <p class="small mb-1">Let's Connect</p>
            <h2 class="display-5 fw-bold">Your Vision, Our Creation</h2>
        </header>

        <div class="row align-items-center">
            <!-- Left Column: The Form Card -->
            <div class="col-lg-6">
                <div class="bg-white p-4 rounded-4 shadow-sm">
                    <!-- Formspree Feedback Messages -->
                    <div data-fs-success class="alert alert-success d-none mb-3">Message sent!</div>
                    <div data-fs-error class="alert alert-danger d-none mb-3">Error sending message.</div>

                    <form id="contact-form">
                        <!-- Name Field -->
                        <div class="mb-3">
                            <label for="full-name" class="form-label fw-bold">Name</label>
                            <input type="text" name="name" id="full-name" class="form-control custom-input" data-fs-field required>
                        </div>

                        <!-- Email Field -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold">Email</label>
                            <input type="email" name="email" id="email" class="form-control custom-input" data-fs-field required>
                        </div>

                        <!-- Message Field -->
                        <div class="mb-4">
                            <label for="message" class="form-label fw-bold">Message</label>
                            <textarea name="message" id="message" class="form-control custom-input" rows="3" data-fs-field required></textarea>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" data-fs-submit-btn class="btn btn-purple px-4 py-2 fw-bold">
                            Send Message
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right Column: Contact Image -->
            <div class="col-lg-6 text-center mt-5 mt-lg-0">
                <a href="https://storyset.com/communication" target="_blank" rel="noopener noreferrer">
                    <img src="/assets/img/Mailbox-rafiki.svg" alt="Contact Illustration" class="img-fluid floating-illustration">
                </a>
            </div>
        </div>
    </div>
</section>

<!-- Formspree Integration Scripts -->
<script>
window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
formspree('initForm', { 
    formElement: '#contact-form', 
    formId: 'mykoyrqo' 
});
</script>
<script src="https://unpkg.com/@formspree/ajax@1" defer></script>
